<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummi - Artisanal & Fresh</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 40px 20px;
            background-color: #1a1a1a;
            border-bottom: 2px solid #b5651d; /* Detalle terracotta */
        }
        .logo-video {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #b5651d;
        }
        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            letter-spacing: 2px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #b5651d;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
        .menu-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: left;
        }
        .menu-category {
            font-size: 1.5rem;
            color: #b5651d;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-size: 1.1rem;
        }
        .menu-item span {
            color: #888;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #1a1a1a;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <video autoplay muted loop playsinline class="logo-video">
            <source src="pon-aqui-el-nombre-de-tu-video.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        
        <h1>TUMMI</h1>
        <p class="subtitle">Artisanal & Fresh Empanadas</p>
    </header>

    <div class="menu-container">
        <h2 class="menu-category">Nuestras Empanadas</h2>
        
        <div class="menu-item">
            <p>Carne de Res Tradicional</p>
            <span>Artisanal</span>
        </div>
        <div class="menu-item">
            <p>Pollo Jugoso</p>
            <span>Artisanal</span>
        </div>
        <div class="menu-item">
            <p>Cerdo Marinado</p>
            <span>Artisanal</span>
        </div>
        <div class="menu-item">
            <p>Espinaca y Kale</p>
            <span>Vegetal</span>
        </div>
        <div class="menu-item">
            <p>Carne Vegana Plant-Based</p>
            <span>Plant-Based</span>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Tummi. Todos los derechos reservados.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummi | Empanadas Artesanales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d0d; color: #f5f5f5; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(13, 13, 13, 0.95); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid #222; }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-container img { width: 45px; height: 45px; object-fit: contain; border-radius: 50%; }
        .logo-container span { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #fff; }
        nav ul { display: flex; list-style: none; gap: 30px; }
        nav ul li a { text-decoration: none; color: #ccc; font-weight: 500; transition: color 0.3s; }
        nav ul li a:hover { color: #d4a373; }
        .hero { height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
        .hero video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.4); }
        .hero-content { position: relative; z-index: 2; max-width: 800px; padding: 0 20px; }
        .hero-content h1 { font-size: 3.5rem; margin-bottom: 20px; color: #fff; letter-spacing: 3px; }
        .hero-content p { font-size: 1.2rem; margin-bottom: 30px; color: #ddd; }
        .btn { display: inline-block; padding: 12px 30px; background-color: #d4a373; color: #0d0d0d; text-decoration: none; font-weight: bold; border-radius: 4px; transition: background 0.3s; }
        .btn:hover { background-color: #bc6c25; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/torremercedes1967-afk/tummi/main/logo.png" alt="Tummi Logo">
            <span>TUMMI</span>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Inicio</a></li>
                <li><a href="#menu">Menú</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" id="home">
        <video autoplay muted loop playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-plate-with-empanadas-42861-large.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>
        <div class="hero-content">
            <h1>SABOR ARTESANAL</h1>
            <p>Empanadas artesanales con ingredientes selectos y un toque único.</p>
            <a href="#menu" class="btn">Ver Menú</a>
        </div>
    </section>

</body>
</html>
